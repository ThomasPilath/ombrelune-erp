<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ERP Ombrelune">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <title>Ombrelune</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("ombrelune-theme");
      const theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.backgroundColor = theme === "dark" ? "#0a0515" : "#f7f3ed";
      document.documentElement.style.color = theme === "dark" ? "#ffffff" : "#1a1230";
    })();
  </script>
</head>
<body class="bg-canvas">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-3">Aller au contenu</a>
  <div id="app"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
